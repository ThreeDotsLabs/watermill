services:
  server:
    image: golang:1.25
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./server:/app
      - $GOPATH/pkg/mod:/go/pkg/mod
    working_dir: /app
    command: 'go run .'

  worker:
    image: golang:1.25
    restart: unless-stopped
    volumes:
      - ./worker:/app
      - $GOPATH/pkg/mod:/go/pkg/mod
    working_dir: /app
    command: 'go run .'

  # The CI check in .validate_example.yml waits for the counter to reach 3, which only real requests can prove.
  requests:
    image: golang:1.25
    depends_on:
      - server
    command: "sh -c 'for i in 1 2 3; do until curl -sf -X POST http://server:8080/count/demo; do sleep 1; done; done'"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: example
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
